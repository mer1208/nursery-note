<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ほいくノート（リアルタイム共有）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 text-slate-800 pb-12">

    <!-- 🔒 ログイン画面（データベース認証版） -->
    <div id="login-screen" class="max-w-md mx-auto p-6 mt-12 bg-white rounded-2xl shadow-sm">
        <div class="text-center mb-6">
            <h1 class="text-xl font-bold text-indigo-600">🧸 ほいくノート</h1>
            <p class="text-xs text-slate-500 mt-1">ログインIDとパスワードを入力してください</p>
        </div>
        <form id="login-form" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">ユーザーID</label>
                <input type="text" id="username-input" placeholder="例: papa" class="w-full border rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">パスワード</label>
                <input type="password" id="password-input" placeholder="パスワードを入力" class="w-full border rounded-lg p-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" required>
            </div>
            <button type="submit" id="login-btn" class="w-full bg-indigo-600 text-white font-bold py-2.5 rounded-lg text-sm shadow">ログインする</button>
            <p id="login-error" class="text-rose-500 text-xs text-center hidden">IDまたはパスワードが違います</p>
        </form>
    </div>

    <!-- 🧸 メインアプリ画面（初期状態では非表示） -->
    <div id="app-screen" class="max-w-md mx-auto p-4 hidden">
        <header class="mb-6 text-center">
            <h1 class="text-xl font-bold text-indigo-600">🧸 ほいくノート</h1>
            <p class="text-xs text-slate-500">パパ・ママリアルタイム共有</p>
        </header>

        <!-- 着替えストックセクション -->
        <section class="bg-white rounded-2xl p-4 shadow-sm mb-6">
            <h2 class="font-bold text-sm text-slate-700 mb-3 flex items-center justify-between">
                <span>👕 ロッカーの着替え状況</span>
                <span id="sync-status" class="text-xs text-emerald-500 font-normal">● 同期中</span>
            </h2>
            <div id="stock-list" class="space-y-3">
                <!-- JavaScriptで動的生成 -->
            </div>
        </section>

        <!-- 連絡メモセクション -->
        <section class="bg-white rounded-2xl p-4 shadow-sm">
            <h2 class="font-bold text-sm text-slate-700 mb-3">📝 昨日のこと・連絡メモ</h2>
            <form id="memo-form" class="space-y-3">
                <input type="date" id="memo-date" class="w-full border rounded-lg p-2 text-sm" required>
                <select id="memo-condition" class="w-full border rounded-lg p-2 text-sm">
                    <option value="🌟 元気いっぱい">🌟 元気いっぱい</option>
                    <option value="💧 鼻水・咳少しあり">💧 鼻水・咳少しあり</option>
                    <option value="⚡ 少し機嫌斜め・発熱気味">⚡ 少し機嫌斜め・発熱気味</option>
                </select>
                <textarea id="memo-text" placeholder="昨日の夕食、睡眠、先生に伝えることなど..." rows="3" class="w-full border rounded-lg p-2 text-sm"></textarea>
                <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-2 rounded-lg text-sm shadow">メモを保存する</button>
            </form>
            <div id="memo-history" class="mt-4 space-y-2 border-t pt-3">
                <!-- 履歴 -->
            </div>
        </section>
    </div>

    <script>
        const SUPABASE_URL = "https://xpqlgbqosjyvvdxausjo.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_5dmK9oGLbvB_Zck-MuGwNA_fwH58LOc";
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 起動時にすでにログイン済みかチェック
        if (sessionStorage.getItem("nursery_auth") === "true") {
            showApp();
        }

        // ログインフォーム送信時の処理（Supabaseの users テーブルと照合）
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const inputUser = document.getElementById('username-input').value.trim();
            const inputPass = document.getElementById('password-input').value.trim();
            const errorMsg = document.getElementById('login-error');
            const loginBtn = document.getElementById('login-btn');

            loginBtn.textContent = "認証中...";
            loginBtn.disabled = true;

            // Supabaseの users テーブルから一致するユーザーを検索
            const { data, error } = await client
                .from('users')
                .select('*')
                .eq('username', inputUser)
                .eq('password', inputPass)
                .single();

            loginBtn.textContent = "ログインする";
            loginBtn.disabled = false;

            if (data && !error) {
                // 認証成功
                sessionStorage.setItem("nursery_auth", "true");
                showApp();
            } else {
                // 認証失敗
                errorMsg.classList.remove('hidden');
            }
        });

        function showApp() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('memo-date').valueAsDate = new Date();
            fetchStock();
            fetchMemos();
        }

        let stockData = [];

        async function fetchStock() {
            const { data } = await client.from('nursery_stock').select('*').order('created_at', { ascending: true });
            if (data) {
                stockData = data;
                renderStock();
            }
        }

        function renderStock() {
            const container = document.getElementById('stock-list');
            container.innerHTML = '';
            
            stockData.forEach(item => {
                const isShort = item.current_count < item.max_count;
                const div = document.createElement('div');
                div.className = `flex items-center justify-between p-2 rounded-xl border ${isShort ? 'bg-rose-50 border-rose-200' : 'bg-slate-50 border-slate-100'}`;
                div.innerHTML = `
                    <div>
                        <span class="font-bold text-sm">${item.item_name}</span>
                        <span class="text-xs ml-2 ${isShort ? 'text-rose-600 font-bold' : 'text-slate-500'}">
                            ${isShort ? `🚨 要補充 (あと${item.max_count - item.current_count}枚)` : '✅ 十分'}
                        </span>
                    </div>
                    <div class="flex items-center space-x-2">
                        <button onclick="updateCount('${item.id}', ${item.current_count - 1})" class="w-8 h-8 bg-white border rounded-lg font-bold shadow-sm active:bg-slate-100">-</button>
                        <span class="w-6 text-center font-bold">${item.current_count}</span>
                        <button onclick="updateCount('${item.id}', ${item.current_count + 1})" class="w-8 h-8 bg-white border rounded-lg font-bold shadow-sm active:bg-slate-100">+</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        window.updateCount = async function(id, newCount) {
            if (newCount < 0) return;
            const target = stockData.find(item => item.id === id);
            if (target) {
                target.current_count = newCount;
                renderStock();
            }
            await client.from('nursery_stock').update({ current_count: newCount }).eq('id', id);
        }

        client.channel('public:nursery_stock')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'nursery_stock' }, payload => {
                fetchStock();
            })
            .subscribe();

        document.getElementById('memo-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const date = document.getElementById('memo-date').value;
            const condition = document.getElementById('memo-condition').value;
            const memo = document.getElementById('memo-text').value;

            await client.from('nursery_logs').insert([{ date, condition, memo }]);
            document.getElementById('memo-text').value = '';
            fetchMemos();
        });

        async function fetchMemos() {
            const { data } = await client.from('nursery_logs').select('*').order('date', { ascending: false }).order('created_at', { ascending: false }).limit(5);
            const history = document.getElementById('memo-history');
            history.innerHTML = '<h3 class="text-xs font-bold text-slate-500 mb-2">直近の記録</h3>';
            
            if (!data) return;

            data.forEach(log => {
                const box = document.createElement('div');
                box.className = 'bg-slate-50 p-2 rounded-lg text-xs space-y-1';
                box.innerHTML = `<div class="font-bold text-indigo-600">${log.date} - ${log.condition}</div><div class="text-slate-600">${log.memo || '特記事項なし'}</div>`;
                history.appendChild(box);
            });
        }

        client.channel('public:nursery_logs')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'nursery_logs' }, payload => {
                fetchMemos();
            })
            .subscribe();
    </script>
</body>
</html>
